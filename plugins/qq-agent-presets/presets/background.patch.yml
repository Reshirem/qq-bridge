- insert:
    - id: preset-memory-organizer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: memory-organizer
        name: 长期记忆整理
        order: 20
        description: 按来源与任务范围整理长期记忆
        plugins:
          - id: background-tools
            name: qq-agent-presets/background-tools.mjs
            config: { kind: memory }
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config: { prefix: "{{qq_background_prompt}}\n\n当前人格卡仅供身份和关系判断：\n{{qq_bridge_active_role_card}}", includeRuntimeContext: false }
    - id: preset-chat-learning
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: chat-learning
        name: 后台聊天学习
        order: 21
        description: 从一个来源的聊天批次学习黑话和表情
        plugins:
          - id: background-tools
            name: qq-agent-presets/background-tools.mjs
            config: { kind: chat }
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config: { prefix: "{{qq_background_prompt}}", includeRuntimeContext: false }
    - id: preset-market-analysis
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: market-analysis
        name: 商城表情分析
        order: 22
        description: 分页查看并注解一包商城表情
        plugins:
          - id: background-tools
            name: qq-agent-presets/background-tools.mjs
            config: { kind: market }
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config: { prefix: "{{qq_background_prompt}}", includeRuntimeContext: false }
